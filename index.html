<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThorHub - iPhone Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #040406;
            --bg-surface: #101016;
            --bg-card: #171720;
            --accent: #ff2a3b;
            --accent-gradient: linear-gradient(135deg, #ff2a3b 0%, #b30012 100%);
            --accent-glow: rgba(255, 42, 59, 0.5);
            --text-main: #fafafa;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-active: rgba(255, 42, 59, 0.6);
            --star-color: #fbbf24;
            --success: #10b981;
            --notes-accent: #3b82f6;
            --maps-accent: #10b981;
            --roulette-accent: #a855f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            padding-top: calc(75px + env(safe-area-inset-top));
            padding-bottom: env(safe-area-inset-bottom);
            min-height: 100vh;
            position: relative;
        }

        .bg-ambient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background-color: var(--bg-base);
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: calc(70px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            background: rgba(6, 6, 9, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
            z-index: 1000;
        }

        .logo { color: var(--text-main); font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        .hub-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
        }

        .hub-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .hub-tab.active { background: var(--accent-gradient); color: #fff; }
        .hub-tab.notes-tab.active { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .hub-tab.maps-tab.active { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
        .hub-tab.roulette-tab.active { background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%); }

        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-add {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        main { padding: 20px 16px 60px 16px; max-width: 1200px; margin: 0 auto; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        .category { margin-bottom: 30px; }
        .category-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
        
        .carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .game-card {
            flex: 0 0 auto;
            width: 130px;
            aspect-ratio: 2 / 3;
            background-color: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-subtle);
        }
        .game-card img { width: 100%; height: 100%; object-fit: cover; }
        .game-card .no-cover { display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 10px; font-size: 0.85rem; color: var(--text-muted); }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(6,6,9,0.8) 0%, transparent 40%, rgba(6,6,9,0.9) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .overlay-top { display: flex; justify-content: space-between; align-items: center; }
        .badge-console, .badge-rating { font-size: 0.6rem; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 6px; font-weight: 700; color: #fff; }
        .badge-rating { color: var(--star-color); }
        .card-genre { font-size: 0.7rem; color: #cbd5e1; }

        .progress-container { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.1); }
        .progress-fill { height: 100%; background: var(--accent-gradient); }
        .progress-fill.completed { background: var(--success); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 6, 9, 0.85);
            backdrop-filter: blur(12px);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-content {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            overflow-y: auto;
        }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: #fff; font-size: 1.2rem; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 6px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { background: #14141c; color: #fff; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; font-size: 0.9rem; outline: none; }
        .btn-submit { background: var(--accent-gradient); color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; margin-top: 10px; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff2a3b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="bg-ambient"></div>
    <nav>
        <div class="logo">Thor<span>Hub</span></div>
        <div class="hub-tabs">
            <button class="hub-tab active" data-target="thorflix-view">Flix</button>
            <button class="hub-tab notes-tab" data-target="notes-view">Notas</button>
            <button class="hub-tab maps-tab" data-target="maps-view">Mapas</button>
            <button class="hub-tab roulette-tab" data-target="roulette-view">Ruleta</button>
        </div>
        <div class="nav-actions">
            <button class="btn-add" id="btn-open-add">+</button>
        </div>
    </nav>
    <main>
        <section id="thorflix-view" class="view-section active">
            <div id="flix-content"></div>
        </section>
        <section id="notes-view" class="view-section">
            <div class="category-title">Notas</div>
            <div id="notes-grid-content"></div>
        </section>
        <section id="maps-view" class="view-section">
            <div class="category-title">Mapas</div>
        </section>
        <section id="roulette-view" class="view-section">
            <div class="category-title">Ruleta</div>
        </section>
    </main>
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <button class="close-btn" id="btn-close-modal">✕</button>
            <h2>Añadir Juego</h2>
            <div class="form-group"><label>Título</label><input type="text" id="game-title"></div>
            <button class="btn-submit" id="btn-save-game">Guardar</button>
        </div>
    </div>
    <script>
        document.getElementById('btn-open-add').onclick = () => document.getElementById('game-modal').style.display = 'flex';
        document.getElementById('btn-close-modal').onclick = () => document.getElementById('game-modal').style.display = 'none';
        document.querySelectorAll('.hub-tab').forEach(t => {
            t.onclick = () => {
                document.querySelectorAll('.hub-tab').forEach(x => x.classList.remove('active'));
                document.querySelectorAll('.view-section').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                document.getElementById(t.getAttribute('data-target')).classList.add('active');
            };
        });
    </script>
</body>
</html>
